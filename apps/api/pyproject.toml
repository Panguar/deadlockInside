[project]
name = "deadlock-api-backend"
version = "0.1.0"
description = "Deadlock Inside backend"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "redis>=6,<8",
  "httpx>=0.28,<1",
  "celery[redis]>=5.4,<6",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx2>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deadlock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
