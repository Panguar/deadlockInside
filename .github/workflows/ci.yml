name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: deadlock
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: deadlock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deadlock -d deadlock_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:8.10.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://deadlock:test-only@127.0.0.1:5432/deadlock_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
      DATABASE_URL: postgresql+psycopg://deadlock:test-only@127.0.0.1:5432/deadlock_test
      REDIS_URL: redis://127.0.0.1:6379/0
      POSTGRES_PASSWORD: ci-only
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.7
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install Python dependencies
        working-directory: apps/api
        run: uv sync --frozen
      - name: Run API integration tests
        working-directory: apps/api
        run: uv run --frozen pytest -v
      - name: Check restore safety guards
        run: sh tests/stage7/test-restore-guards.sh
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate OpenAPI client and check for changes
        run: |
          pnpm generate:api
          git diff --exit-code -- packages/api-client/openapi.json packages/api-client/src/schema.d.ts
      - name: Typecheck and build web
        run: |
          pnpm typecheck
          pnpm build
      - name: Install Playwright browser
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Run browser tests
        run: pnpm test:e2e
