services:
  fixture:
    image: deadlock-inside-fixture:local
    build:
      context: .
      dockerfile: tests/scripts/fixture-provider.Dockerfile
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/live', timeout=2)"]
      interval: 2s
      timeout: 2s
      retries: 10
  api:
    environment:
      DEADLOCK_API_BASE_URL: http://fixture:8080/v1
    depends_on:
      fixture:
        condition: service_healthy
  worker:
    environment:
      DEADLOCK_API_BASE_URL: http://fixture:8080/v1
    depends_on:
      fixture:
        condition: service_healthy
  beat:
    environment:
      DEADLOCK_API_BASE_URL: http://fixture:8080/v1
    depends_on:
      fixture:
        condition: service_healthy
